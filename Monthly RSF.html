<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punjab RSF Mobile Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f3f4f6; 
            --card: #ffffff; 
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 16px; color: var(--text-dark); }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header h2 { margin: 0; font-size: 1.4rem; color: #111827; }
        .header p { margin: 4px 0 0; color: var(--text-muted); font-size: 0.85rem; }
        
        .filters { display: flex; gap: 12px; background: var(--card); padding: 16px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 20px; flex-wrap: wrap; }
        .filter-group { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .filters select { padding: 10px 14px; border-radius: 10px; border: 2px solid #e5e7eb; font-size: 1rem; font-weight: 500; color: var(--text-dark); outline: none; background: #f9fafb; cursor: pointer; transition: 0.2s; }
        .filters select:focus { border-color: #3b82f6; background: #fff; }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .metric-card { padding: 24px; border-radius: 16px; box-shadow: var(--shadow); color: white; position: relative; overflow: hidden; }
        .metric-card h4 { margin: 0; font-size: 0.9rem; font-weight: 600; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-card .val { font-size: 2.2rem; font-weight: 800; margin-top: 8px; letter-spacing: -0.5px; }
        .metric-icon { position: absolute; right: -10px; bottom: -15px; font-size: 6rem; opacity: 0.15; }
        
        .card-blue { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        .card-red { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .card-green { background: linear-gradient(135deg, #059669, #10b981); }

        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .chart-box { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); height: 350px; position: relative; }
        
        .table-box { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); overflow-x: auto; margin-bottom: 24px; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #f3f4f6; }
        th { background: #f9fafb; font-weight: 700; color: #4b5563; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        tr:hover { background: #f9fafb; }
        .txt-red { color: #dc2626; font-weight: bold; background: #fef2f2; border-radius: 6px; padding: 4px 8px; }
        .txt-green { color: #059669; font-weight: bold; }

        .matrix-table th, .matrix-table td { padding: 10px 12px; font-size: 0.85rem; border: 1px solid #f3f4f6; }
        .matrix-table th { background: #f8fafc; vertical-align: bottom; line-height: 1.3; border-bottom: 2px solid #e2e8f0; }
        .matrix-table td { vertical-align: middle; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header, .filters, .chart-box, .table-box { padding: 15px; }
            .metric-card .val { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2><i class="fa-solid fa-chart-line" style="color:#2563eb; margin-right:8px;"></i>Punjab Dashboard</h2>
            <p>Target & Actuals Analysis</p>
        </div>
        <button onclick="window.print()" style="padding:10px 20px; background:#1f2937; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600;"><i class="fa-solid fa-download" style="margin-right:6px;"></i> Save PDF</button>
    </div>

    <!-- COLORFUL FILTERS -->
    <div class="filters">
        <div class="filter-group">
            <label><i class="fa-regular fa-calendar" style="margin-right:4px;"></i> Month</label>
            <select id="monthFilter" onchange="applyFilters()">
                <option value="Oct" selected>October (Current)</option>
                <option value="ALL">Full Year (All)</option>
                <option value="Apr">April</option>
                <option value="May">May</option>
                <option value="Jun">June</option>
                <option value="Jul">July</option>
                <option value="Aug">August</option>
                <option value="Sep">September</option>
                <option value="Nov">November</option>
                <option value="Dec">December</option>
                <option value="Jan">January</option>
                <option value="Feb">February</option>
                <option value="Mar">March</option>
            </select>
        </div>
        <div class="filter-group">
            <label><i class="fa-solid fa-location-dot" style="margin-right:4px;"></i> Territory</label>
            <select id="terrFilter" onchange="applyFilters()"><option value="ALL">All Territories</option></select>
        </div>
        <div class="filter-group">
            <label><i class="fa-solid fa-tag" style="margin-right:4px;"></i> Brand</label>
            <select id="brandFilter" onchange="applyFilters()"><option value="ALL">All Brands</option></select>
        </div>
    </div>

    <!-- 3 KPI TILES -->
    <div class="metrics-grid">
        <div class="metric-card card-blue">
            <i class="fa-solid fa-boxes-stacked metric-icon"></i>
            <h4 id="lblGross">Billed Qty</h4>
            <div class="val" id="kpiGross">0</div>
        </div>
        <div class="metric-card card-red">
            <i class="fa-solid fa-arrow-right-arrow-left metric-icon"></i>
            <h4 id="lblRet">Return Qty</h4>
            <div class="val" id="kpiRet">0</div>
        </div>
        <div class="metric-card card-green">
            <i class="fa-solid fa-box-check metric-icon"></i>
            <h4 id="lblNet">Net Qty</h4>
            <div class="val" id="kpiNet">0</div>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-box"><canvas id="chartTerritory"></canvas></div>
        <div class="chart-box"><canvas id="chartBrand"></canvas></div>
    </div>

    <!-- STANDARD TABLE -->
    <div class="table-box">
        <h3 style="margin-top:0; color:#1f2937;"><i class="fa-solid fa-list" style="color:#6b7280; margin-right:8px;"></i>Detailed Packing Breakdown</h3>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Territory</th>
                    <th>Brand</th>
                    <th>Product Description</th>
                    <th>Billed (L/Kg)</th>
                    <th>Return (L/Kg)</th>
                    <th>Net (L/Kg)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- CROSS-TAB MATRIX TABLE (BY BRAND) -->
    <div class="table-box">
        <h3 style="margin-top:0; color:#1f2937;"><i class="fa-solid fa-map-location-dot" style="color:#6b7280; margin-right:8px;"></i>Territory vs Brand (Net Qty)</h3>
        <table id="matrixTable" class="matrix-table">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

                // Determine Volume based on month selection
                let gross = 0, ret = 0, net = 0;
                if (selMonth === 'ALL') {
                    for(let m in d.months) {
                        gross += d.months[m].gross;
                        ret += d.months[m].return;
                        net += d.months[m].net;
                    }
                } else {
                    if(d.months[selMonth]) {
                        gross = d.months[selMonth].gross;
                        ret = d.months[selMonth].return;
                        net = d.months[selMonth].net;
                    }
                }

                let val = net * d.ndp; 

                // Populate Global Aggregations & Detailed Table (Respects ALL filters)
                if ((selTerr === 'ALL' || d.territory === selTerr) && (selBrand === 'ALL' || d.brand === selBrand)) {
                    if (net !== 0 || gross !== 0 || ret !== 0) {
                        tGross += gross;
                        tRet += ret;
                        tNet += net;

                        terrAgg[d.territory] = (terrAgg[d.territory] || 0) + val; // Val for Graph 1
                        brandAgg[d.brand] = (brandAgg[d.brand] || 0) + net;       // Net Qty for Graph 2

                        tableRows.push({
                            territory: d.territory, brand: d.brand, product: d.product, 
                            gross: gross, ret: ret, net: net
                        });
                    }
                }

                // Populate Matrix Data (Respects Brand filter, but ALWAYS shows ALL Territories)
                if (selBrand === 'ALL' || d.brand === selBrand) {
                    if (!matrixData[d.brand]) {
                        matrixData[d.brand] = { totalQty: 0 };
                        allTerritories.forEach(t => matrixData[d.brand][t] = 0);
                    }
                    matrixData[d.brand][d.territory] += net;
                    matrixData[d.brand].totalQty += net;

                    terrTotalsValue[d.territory] += val;
                    grandTotalValue += val;
                }
            });

            // Top KPI Tiles
            document.getElementById('kpiGross').innerText = tGross.toLocaleString('en-IN');
            document.getElementById('kpiRet').innerText = tRet.toLocaleString('en-IN');
            document.getElementById('kpiNet').innerText = tNet.toLocaleString('en-IN');

            // Draw Charts & Detailed Table
            renderCharts(terrAgg, brandAgg);
            tableRows.sort((a, b) => b.net - a.net);
            renderTable(tableRows);

            // Draw Matrix Table
            renderMatrix(matrixData, allTerritories, terrTotalsValue, grandTotalValue);
        }

        function renderCharts(terrData, brandData) {
            if (chartTerr) chartTerr.destroy();
            if (chartBrand) chartBrand.destroy();

            // CHART 1: Net Value (₹) by Territory
            const terrLabels = Object.keys(terrData);
            chartTerr = new Chart(document.getElementById('chartTerritory'), {
                type: 'bar',
                data: {
                    labels: terrLabels,
                    datasets: [{ 
                        label: 'Net Value (₹)', 
                        data: terrLabels.map(l => terrData[l]), 
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'],
                        borderRadius: 6
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: {display: false},
                        title: { display: true, text: 'Net Value (Sale in ₹) by Territory', font: { size: 15, family: 'Segoe UI' }, color: '#1f2937' }
                    },
                    scales: {
                        y: { ticks: { callback: function(value) { return '₹' + (value/100000).toFixed(1) + 'L'; } } }
                    }
                }
            });

            // CHART 2: Top Brands by Net Qty
            const topBrands = Object.entries(brandData).sort((a,b) => b[1] - a[1]).slice(0, 6);
            chartBrand = new Chart(document.getElementById('chartBrand'), {
                type: 'doughnut',
                data: {
                    labels: topBrands.map(x => x[0]),
                    datasets: [{ 
                        data: topBrands.map(x => x[1]), 
                        backgroundColor: ['#2563eb','#059669','#ea580c','#7c3aed','#be123c','#0891b2'],
                        borderWidth: 2
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        title: { display: true, text: 'Top Brands by Net Qty', font: { size: 15, family: 'Segoe UI' }, color: '#1f2937' },
                        legend: { position: 'bottom' }
                    },
                    cutout: '65%'
                }
            });
        }

        function renderTable(rows) {
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = rows.slice(0, 150).map(r => `
                <tr>
                    <td><b>${r.territory}</b></td>
                    <td><span style="background:#e0e7ff; color:#3730a3; padding:4px 8px; border-radius:6px; font-size:0.8rem; font-weight:700;">${r.brand}</span></td>
                    <td style="color:#4b5563;">${r.product}</td>
                    <td>${r.gross.toLocaleString('en-IN')}</td>
                    <td><span class="${r.ret > 0 ? 'txt-red' : ''}">${r.ret > 0 ? '-' : ''}${r.ret.toLocaleString('en-IN')}</span></td>
                    <td class="txt-green">${r.net.toLocaleString('en-IN')}</td>
                </tr>
            `).join('');
        }

        function renderMatrix(matrixData, territories, terrTotalsValue, grandTotalValue) {
            const thead = document.querySelector('#matrixTable thead');
            const tbody = document.querySelector('#matrixTable tbody');
            
            // Build Matrix Header
            let headHTML = `<tr><th style="min-width: 140px; text-align: left;">Brand Name</th>`;
            territories.forEach(t => {
                let valLakhs = (terrTotalsValue[t] / 100000).toFixed(2);
                headHTML += `
                    <th style="text-align: center; min-width: 70px; white-space: normal;">
                        <div style="color: #059669; font-size: 0.9rem; font-weight: 800;">₹${valLakhs}L</div>
                        <div style="font-size: 0.75rem; color: #4b5563; margin-top:2px;">${t}</div>
                    </th>`;
            });
            let grandValLakhs = (grandTotalValue / 100000).toFixed(2);
            headHTML += `
                <th style="text-align: center; min-width: 80px; white-space: normal; background: #e0e7ff;">
                    <div style="color: #4338ca; font-size: 0.9rem; font-weight: 800;">₹${grandValLakhs}L</div>
                    <div style="font-size: 0.75rem; color: #4b5563; margin-top:2px;">TOTAL PUNJAB</div>
                </th></tr>`;
            thead.innerHTML = headHTML;

            // Build Matrix Body (sorted by highest Total Qty)
            const sortedBrands = Object.keys(matrixData).sort((a, b) => matrixData[b].totalQty - matrixData[a].totalQty);
            let bodyHTML = '';

            sortedBrands.forEach(b => {
                if (matrixData[b].totalQty === 0) return; // Hide empty rows
                
                bodyHTML += `<tr>
                    <td style="white-space: normal; color: #2563eb; font-weight: 700; font-size: 0.85rem; text-transform: uppercase;">
                        ${b}
                    </td>`;
                
                territories.forEach(t => {
                    let qty = matrixData[b][t];
                    bodyHTML += `<td style="text-align: center;">${qty === 0 ? '-' : qty.toLocaleString('en-IN')}</td>`;
                });
                
                bodyHTML += `<td style="text-align: center; font-weight: bold; background: #f8fafc; color: #111827;">${matrixData[b].totalQty.toLocaleString('en-IN')}</td>
                </tr>`;
            });
            tbody.innerHTML = bodyHTML;
        }

        window.onload = init;
    </script>
</body>
</html>
